appId: com.quotaflow.desktop
productName: Quota-Flow
electronDist: node_modules/electron/dist
directories:
  output: release
extraResources:
  - from: node_modules/ffmpeg-static
    to: ffmpeg
    filter:
      - ffmpeg.exe
      - LICENSE
files:
  - out/**
  - "!node_modules/@quota-flow/*/src/**"
  - "!node_modules/@quota-flow/*/.turbo/**"
  - "!node_modules/@quota-flow/*/tsconfig.json"
  - "!node_modules/@quota-flow/*/tsup.config.ts"
  - "!node_modules/@quota-flow/*/dist/*.map"
  - "!node_modules/@supabase/**/*.map"
  - "!node_modules/@supabase/**/src/**"
  - "!node_modules/@supabase/**/*.tsbuildinfo"
asar: true
electronLanguages:
  - zh-CN
  - en-US
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName} Setup ${version}.${ext}
portable:
  artifactName: ${productName} Portable ${version}.${ext}
publish:
  provider: github
  owner: Shaun520
  repo: quota-flow
  private: false
  releaseType: release
