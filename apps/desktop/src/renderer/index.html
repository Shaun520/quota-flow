<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws://localhost:* http://localhost:*"
    />
    <title>Quota-Flow</title>
    <script>
      (function(){var t=localStorage.getItem('qf-theme');document.documentElement.setAttribute('data-theme',t||'dark');var f=localStorage.getItem('qf-font-size');if(f&&/^(12|13|14|15|16)$/.test(f))document.documentElement.style.fontSize=f+'px';})();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
