appId: com.quotaflow.desktop
productName: Quota-Flow
directories:
  output: release
extraResources:
  - from: node_modules/ffmpeg-static
    to: ffmpeg
    filter:
      # ffmpeg.exe(win) / ffmpeg(mac,linux) 均需要随包分发
      - ffmpeg*
      - LICENSE
files:
  - out/**
  - "!node_modules/@quota-flow/*/src/**"
  - "!node_modules/@quota-flow/*/.turbo/**"
  - "!node_modules/@quota-flow/*/tsconfig.json"
  - "!node_modules/@quota-flow/*/tsup.config.ts"
  - "!node_modules/@quota-flow/*/dist/*.map"
  - "!node_modules/@supabase/**/*.map"
  - "!node_modules/@supabase/**/src/**"
  - "!node_modules/@supabase/**/*.tsbuildinfo"
asar: true
electronLanguages:
  - zh-CN
  - en-US
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
mac:
  icon: build/icon.png
  category: public.app-category.utilities
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    # zip 是 electron-updater 在 macOS 上自动更新所必需的产物
    - target: zip
      arch:
        - x64
        - arm64
linux:
  icon: build/icon.png
  category: Utility
  maintainer: Quota-Flow
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName} Setup ${version}.${ext}
portable:
  artifactName: ${productName} Portable ${version}.${ext}
publish:
  provider: github
  owner: Shaun520
  repo: quota-flow
  private: false
  releaseType: release
