appId: com.quotaflow.desktop
productName: Quota-Flow
electronDist: node_modules/electron/dist
directories:
  output: release
files:
  - out/**
asar: true
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName} Setup ${version}.${ext}
portable:
  artifactName: ${productName} Portable ${version}.${ext}
