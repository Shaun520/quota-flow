name: Release Desktop

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: Windows, os: windows-latest, args: --win }
          - { name: macOS, os: macos-latest, args: --mac }
          - { name: Linux, os: ubuntu-latest, args: --linux }
    env:
      # 无签名发布：禁止 electron-builder 自动探测签名身份，避免 macOS 构建报错
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.7.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install AppImage deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # CI 全新 clone 下 packages/* 无 dist 产物，需先构建 workspace 包，桌面端构建才能解析 @quota-flow/*
      - name: Build workspace packages
        run: pnpm --filter './packages/*' run build
      # 只打包不上传（--publish never），产物作为 artifact 交给后续 deploy job 统一发布，
      # 避免多 job 并行 electron-builder 各自创建 Release 造成重复
      - name: Build installers
        run: pnpm -C apps/desktop run build && pnpm -C apps/desktop exec electron-builder ${{ matrix.platform.args }} --publish never
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform.name }}
          path: apps/desktop/release/*
          if-no-files-found: error

  deploy:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
      # 汇总所有平台安装包到一个 Release（幂等：已存在则跳过创建）
      - name: Create & upload release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$GITHUB_REF_NAME"
          gh release create "$VERSION" installers/*/* \
            --repo "${{ github.repository }}" \
            --title "$VERSION" \
            --notes "Release $VERSION" || echo "release already exists, upload upgraded"